/* The book's bootstrap: drop the no-JS layout before first paint. If the planner has not built
   itself 8 s later (a failed script, a thrown error), say so instead of a skeleton forever. */
document.documentElement.className='js-tabs';
setTimeout(function(){ if(document.querySelector('.pl-skel')) document.documentElement.classList.add('pl-failed'); },8000);

</script>
