<!doctype html>
<html lang="ja" class="js-tabs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>planner-cal harness</title>
<!-- Dev only: python3 tools/cal_fixture.py, then serve the repo (python3 -m http.server 8797) and
     open /tools/cal-harness.html. ?lang=en starts in English; ?only=cal|ver shows one view. -->
<link rel="stylesheet" href="../poc.css">
<link rel="stylesheet" href="../planner.css">
<link rel="stylesheet" href="../planner-cal.css">
<style>
  .v-plan{container-type:inline-size;padding:24px 24px 48px;}
  @media (max-width:639px){.v-plan{padding:16px 16px 40px;}}
  .h-bar{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:12px 24px;font:13px system-ui;color:var(--muted);}
  .h-bar button{min-height:44px;padding:0 14px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);}
  #log{font:12px ui-monospace,monospace;color:var(--muted);white-space:pre-wrap;min-height:1em;}
</style>
</head>
<body>
<article class="guide t-nz" data-guide="nz">
  <div class="h-bar"><span id="log"></span><button type="button" id="lang">EN / JA</button></div>
  <div class="views"><section class="view v-plan">
    <div class="pl-cal-pair"><div id="cal"></div><div id="ver"></div></div>
  </section></div>
</article>
<script>var planner=function(){};</script>
<script src="../planner-cal.js"></script>
<script>
(function(){
  var q=new URLSearchParams(location.search), log=document.getElementById('log');
  if(q.get('lang')==='en') document.documentElement.lang='en';
  function say(s){ log.textContent=s; console.log(s); }
  document.getElementById('lang').onclick=function(){
    var l=document.documentElement.lang==='en'?'ja':'en';
    document.documentElement.lang=l;
    document.dispatchEvent(new CustomEvent('langchange',{detail:l}));
  };
  fetch('fixtures/cal-model.json').then(function(r){ return r.json(); }).then(function(m){
    var opts={
      onDay:function(d){ say('onDay '+d); },
      onDropStop:function(d,p){ say('onDropStop '+d+' '+JSON.stringify(p)); },
      onUseVersion:function(id){ say('onUseVersion '+id); },
      onTakeDay:function(id,d){ say('onTakeDay '+id+' '+d); }
    };
    var only=q.get('only');
    if(only!=='ver') planner.cal.render(document.getElementById('cal'),m,opts); else document.getElementById('cal').remove();
    if(only!=='cal') planner.cal.renderVersions(document.getElementById('ver'),m,opts); else document.getElementById('ver').remove();
    window.__model=m;
  });
})();
</script>
</body>
</html>
