<!doctype html>
<meta charset="utf-8">
<title>planner perf</title>
<!-- The performance gate (docs/DESIGN.md "Performance rules", research/ux/perf-review.md §4). Not shipped.
     Run headless with 4x CPU through tools/perf-run.js; opening it by hand measures unthrottled.
       /tools/perf.html                 every case, median of 5
       /tools/perf.html?case=day&n=3    only cases whose name contains "day", 3 runs each
       /tools/perf.html?record=1        also print the seed numbers as a new tools/perf-baseline.json
     It overwrites plan:nz and plan-ui:nz for this origin, so use a throwaway profile.

     States, generated in-page from a seeded PRNG (no fixture checked in):
       seed  today's data: the first curated plan as My plan, no imports, no tiers (the baseline)
       A     3,345 imports (2,345 Japan, 1,000 NZ), 500 tiers, 40 groups, 20 versions, 12-stop days
       B     1,000 NZ imports, the rest as A

     Measures:
       next   dispatch -> requestAnimationFrame -> setTimeout 0 (the handler, the render, the frame)
       block  the longest gap in a 4 ms setTimeout heartbeat on this page while the interaction settles.
              The app's iframe shares this main thread, so a gap is the longest stretch of work
              (script, style, layout, paint) that kept everything else waiting
       p95    rAF frame deltas while a scripted drag sends one pointer event per frame
       boot   the longest long task after the app's first contentful paint (else the longest heartbeat gap)

     Normalisation (the baseline guard): CI machines are not this Mac. Each run first times a fixed
     calibration workload (seeded JS: sort, JSON round trip; plus a DOM build and forced layout) under
     the same throttle, median of 5, again before every case (so a machine that gets busier mid-run
     moves the yardstick with the numbers). Baselines are stored as ms / calibration ms, and a seed
     case fails when its ratio exceeds 1.25 x the recorded ratio (plus one 16 ms frame of slack, so a
     25 ms case cannot fail on which frame a lazy load lands in). The drag's p95 is a frame interval, bound to vsync rather
     than CPU speed, so it is guarded in plain ms (1.25 x). Toggle cases (a chip on/off, typing a
     letter and deleting it) report each direction's median in "dirs" and gate the worse one. Stress gates are absolute ms against the DESIGN.md targets and
     only warn until STRESS_FAILS is true. -->
<style>body{margin:0;font:12px monospace} iframe{position:absolute;left:0;top:0;border:0;background:#fff} #out{position:absolute;left:0;top:1100px;white-space:pre-wrap}</style>
<pre id="out">PERF RUNNING</pre>
<script>
const STRESS_FAILS = false;   /* flip once the P0 fixes land (docs/DESIGN.md "Gate") */
const GUARD = 1.25, QUANTUM = 16;   /* one 60 Hz frame of slack on top of the ratio */
(async () => {
  const P = new URLSearchParams(location.search), N = Math.max(1, +P.get('n') || 5), ONLY = P.get('case') || '', RECORD = P.has('record');
  const out = document.getElementById('out'), lines = [];
  const say = s => { lines.push(s); out.textContent = lines.join('\n') + '\nPERF RUNNING'; };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const median = a => { const s = a.slice().sort((x, y) => x - y), m = s.length >> 1; return s.length ? (s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2) : NaN; };
  const p95 = a => { const s = a.slice().sort((x, y) => x - y); return s[Math.min(s.length - 1, Math.floor(s.length * .95))]; };
  const r1 = x => Math.round(x * 10) / 10;
  const until = async (f, ms = 15000) => { const t = performance.now(); while (performance.now() - t < ms) { try { const v = f(); if (v) return v; } catch (e) {} await wait(50); } return null; };
  const next = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));

  /* ---------- heartbeat: the longest stretch the main thread was busy ---------- */
  let hbOn = false, hbLast = 0, hbGaps = [];
  const beat = () => { const t = performance.now(); if (t - hbLast > 6) hbGaps.push([hbLast, t - hbLast]); hbLast = t; if (hbOn) setTimeout(beat, 0); };
  const hbStart = () => { hbGaps = []; hbLast = performance.now(); if (!hbOn) { hbOn = true; setTimeout(beat, 0); } };
  /* the longest gap that began at or after `from` (a 4 ms beat when nothing blocked) */
  const hbStop = (from = 0) => { hbOn = false; return hbGaps.filter(g => g[0] >= from).reduce((m, g) => Math.max(m, g[1]), 4); };
  /* wait until nothing longer than `gap` ms has blocked for `quiet` ms */
  const settle = async (quiet = 500, gap = 30, max = 8000) => { const t0 = performance.now(); let last = performance.now(), prev = performance.now();
    while (performance.now() - t0 < max) { await wait(0); const t = performance.now(); if (t - prev > gap) last = t; prev = t; if (t - last > quiet) return; } };

  /* ---------- calibration: a fixed workload, so baselines travel between machines ---------- */
  function calibrate() {
    const t = performance.now();
    let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
    const a = Array.from({length: 40000}, rnd).sort((x, y) => x - y);
    const o = Array.from({length: 3000}, (_, i) => ({id: 'p' + i, v: a[i * 13 % a.length], t: ['must', 'want', 'maybe'][i % 3], n: 'name ' + i}));
    JSON.parse(JSON.stringify(o));
    const box = document.createElement('div'); box.style.cssText = 'position:absolute;left:-9999px;top:0;width:360px';
    box.innerHTML = o.slice(0, 1500).map(x => `<div class="c"><b>${x.n}</b> <span>${x.t}</span> <i>${x.v.toFixed(4)}</i></div>`).join('');
    document.body.appendChild(box); void box.offsetHeight; box.style.width = '300px'; void box.offsetHeight; box.remove();
    return performance.now() - t;
  }

  /* ---------- state ---------- */
  const plans = await (await fetch('../data/nz/plans.json')).json();
  const places = await (await fetch('../data/nz/places.json')).json();
  let base = (plans.plans || [])[0];
  if (!base) base = ((await (await fetch('fixtures/presets.json')).json()).plans || [])[0];
  const DATES = plans.days.map(d => d.date), PIDS = places.map(p => p.id);
  const mulberry = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const seedState = () => ({v: 2, active: 'my', trip: {tier: {}, groups: [], notes: {}},
    my: {id: 'my', days: JSON.parse(JSON.stringify(base.days)), stay: base.stay || {}, start: base.start || {}, notes: {}}, versions: [], imports: [], booked: {}});
  function stressState(jp) {
    const R = mulberry(20270211), pick = a => a[Math.floor(R() * a.length)];
    const RG = ['Auckland', 'Northland', 'Waikato', 'Taranaki', 'Bay of Plenty', 'Wellington'], JR = ['Tokyo', 'Kyoto', 'Osaka', 'Hokkaido', 'Okinawa', 'Fukuoka'];
    const imp = (i, cc) => { const nz = cc === 'nz';
      return {id: 'gm-perf-' + cc + i, name: (nz ? 'NZ spot ' : 'スポット ') + i, src: 'gmaps', cc, region: nz ? pick(RG) : pick(JR), note: R() < .2 ? 'note ' + i : '',
        lat: nz ? -41.2 + R() * 6.5 : 31 + R() * 12, lon: nz ? 172.8 + R() * 5.6 : 130 + R() * 12,
        url: 'https://www.google.com/maps/place/?q=place_id:perf' + cc + i}; };
    const imports = [];
    for (let i = 0; i < 1000; i++) imports.push(imp(i, 'nz'));
    if (jp) for (let i = 0; i < 2345; i++) imports.push(imp(i, 'jp'));
    const pool = PIDS.concat(imports.filter(m => m.cc === 'nz').map(m => m.id)), tier = {}, T = ['must', 'want', 'maybe', 'skip'];
    const shuffled = pool.slice().sort(() => R() - .5);
    shuffled.slice(0, 500).forEach((id, i) => { tier[id] = T[i % 4]; });
    const groups = [], used = new Set(), tiered = shuffled.slice(0, 500);
    for (let g = 0, k = 0; g < 40; g++) { const ids = []; const n = 2 + Math.floor(R() * 5);
      while (ids.length < n && k < tiered.length) { const id = tiered[k++]; if (!used.has(id)) { used.add(id); ids.push(id); } }
      groups.push({id: 'g-perf' + g, name: 'グループ ' + g, ids}); }
    const days12 = () => { const d = {}; DATES.forEach(dt => { const s = new Set(); while (s.size < 12) s.add(pick(PIDS)); d[dt] = [...s]; }); return d; };
    const versions = Array.from({length: 20}, (_, i) => ({id: 'v-perf' + i, name: '案 ' + (i + 1), at: 1790000000000 + i * 3600000, days: days12(), stay: {}, start: {}, notes: {}}));
    return {v: 2, active: 'my', trip: {tier, groups, notes: {}}, my: {id: 'my', days: days12(), stay: {}, start: {}, notes: {}}, versions, imports, booked: {}};
  }
  const STATES = {};
  const stateStr = k => STATES[k] || (STATES[k] = JSON.stringify(k === 'seed' ? seedState() : stressState(k === 'A')));

  /* ---------- the app in a frame ---------- */
  let fr = null;
  const VP = {393: [393, 852], 1440: [1440, 900], 1920: [1920, 1080]};
  async function boot(state, vp, stage) {
    if (fr) { fr.remove(); fr = null; await wait(50); }
    localStorage.clear();
    localStorage.setItem('plan:nz', stateStr(state));
    localStorage.setItem('plan-ui:nz', JSON.stringify({v: 1, day: 0, stage, map: 'peek', hideIntro: true, hideInstall: true}));
    fr = document.createElement('iframe'); const [w, h] = VP[vp]; fr.style.width = w + 'px'; fr.style.height = h + 'px';
    document.body.appendChild(fr);
    const t0 = performance.now();
    await new Promise(r => { fr.onload = r; fr.src = '../index.html?nosw&perf=' + Date.now(); });
    return t0;
  }
  const doc = () => fr.contentDocument, q = s => doc().querySelector(s), qa = s => [...doc().querySelectorAll(s)];
  const first = (...ss) => { for (const s of ss) { const e = q(s); if (e) return e; } return null; };
  const W = () => fr.contentWindow;

  /* ---------- cases ---------- */
  /* each returns an array of samples (ms), or null when its control is missing (skip) */
  const C = {};
  const chip = () => first('.pl-collect [data-ca="f"][data-k="cat"]', '.pl-collect [data-ca="f"]', '.pl-collect .pl-chip');
  C.collect_render = async (state, vp) => {
    await boot(state, vp, 'collect');
    if (!await until(() => chip() && first('.pl-collect .pl-cc', '.pl-collect .pl-card'), 30000)) return null;
    await settle(800);
    const xs = [[], []];   /* on (fewer cards) and off (every card): the worse direction is the number */
    for (let i = 0; i < N * 2; i++) { const c = chip(); if (!c) return null; const t = performance.now(); c.click(); await next(); xs[i % 2].push(performance.now() - t); await settle(300); }
    return xs;
  };
  C.collect_key = async (state, vp) => {
    await boot(state, vp, 'collect');
    const inp = () => first('.pl-collect input[type="search"]', '.pl-collect .pl-field input', '.pl-collect input');
    if (!await until(() => inp() && first('.pl-collect .pl-cc', '.pl-collect .pl-card'), 30000)) return null;
    await settle(800);
    const xs = [[], []];   /* typing "a" (narrows) and deleting it (the whole list again): the worse direction is the number */
    for (let i = 0; i < N * 2; i++) { const el = inp(); if (!el) return null;
      el.focus(); el.value = i % 2 ? '' : 'a';
      hbStart(); el.dispatchEvent(new (W().InputEvent)('input', {bubbles: true, data: i % 2 ? null : 'a', inputType: i % 2 ? 'deleteContentBackward' : 'insertText'}));
      await settle(400); xs[i % 2].push(hbStop()); }
    return xs;
  };
  const dayBtn = k => first(`.pl-days [data-day="${k}"]`, `.pl-days button[data-day="${k}"]`, `.v-plan nav [data-day="${k}"]`);
  C.day_switch = async (state, vp) => {
    await boot(state, vp, 'plan');
    if (!await until(() => dayBtn(1) && first('.pl-main li', '.pl-main .pl-row', '.pl-main .pl-card'), 30000)) return null;
    await until(() => q('.pl-palette') && q('.pl-palette').children.length, 8000);   /* the desk chunk, after paint */
    await settle(1000);
    const xs = [];
    for (let i = 0; i < N * 2; i++) { const b = dayBtn(1 + i % 5); if (!b) return null; const t = performance.now(); b.click(); await next(); xs.push(performance.now() - t); await settle(300); }
    return xs;
  };
  let dragMax = [];
  C.board_drag = async (state, vp) => {
    dragMax = [];
    await boot(state, vp, 'plan');
    const lanes = () => { const b = q('.pl-board'); return b ? [...b.children].filter(x => x.querySelector('[data-drag]')) : []; };
    if (!await until(() => lanes().length >= 4, 30000)) return null;
    await settle(1000);
    const PE = W().PointerEvent, pe = (el, type, x, y) => el.dispatchEvent(new PE(type, {bubbles: true, cancelable: true, pointerType: 'mouse', clientX: x, clientY: y, button: 0, buttons: type === 'pointerup' ? 0 : 1, pointerId: 1, isPrimary: true}));
    const raf = () => new Promise(r => W().requestAnimationFrame(r));
    const xs = [];
    for (let run = 0; run < N; run++) {
      const ls = lanes(), src = ls[0].querySelector('[data-drag]'), sr = src.getBoundingClientRect(), tg = ls.slice(1, 4).map(l => l.getBoundingClientRect());
      pe(src, 'pointerdown', sr.left + 10, sr.top + 8);
      const pts = []; for (let i = 1; i <= 90; i++) { const seg = Math.min(2, Math.floor((i - 1) / 30)), f = ((i - 1) % 30 + 1) / 30, a = seg ? tg[seg - 1] : sr, b = tg[seg];
        pts.push([a.left + 20 + (b.left - a.left) * f, (a.top + 60) + (b.top + 80 - a.top - 60) * f]); }
      let prev = await raf(); const d = []; let on = false;
      for (const [x, y] of pts) { pe(W(), 'pointermove', x, y); const t = await raf(); d.push(t - prev); prev = t; on = on || !!q('.is-lifted, .is-dragging, .pl-dragging, .pl-dragghost:not([hidden])'); }
      pe(W(), 'pointercancel', pts[89][0], pts[89][1]);   /* cancel, so the plan is the same for the next run */
      if (!on) return null;   /* the controller never lifted: the selectors are stale, say skip rather than a fake 16.7 */
      xs.push(p95(d.slice(3))); dragMax.push(Math.max(...d));
      await settle(400);
    }
    return xs;
  };
  C.boot = (state, vp) => bootCase(state, vp, 'plan');
  C.boot_collect = (state, vp) => bootCase(state, vp, 'collect');
  const bootCase = async (state, vp, stage) => {
    const xs = [];
    for (let run = 0; run < N; run++) {
      const lt = []; const po = new PerformanceObserver(l => l.getEntries().forEach(e => lt.push(e))); try { po.observe({type: 'longtask'}); } catch (e) {}
      hbStart(); await boot(state, vp, stage);
      const shown = stage === 'plan' ? () => first('.pl-main li', '.pl-main .pl-row', '.pl-main .pl-card') : () => first('.pl-collect .pl-cc', '.pl-collect .pl-card');
      if (!await until(shown, 30000)) { po.disconnect(); hbStop(); return null; }
      const fcpE = await until(() => W().performance.getEntriesByType('paint').find(e => e.name === 'first-contentful-paint'), 5000);
      const fcp = fcpE ? fcpE.startTime + W().performance.timeOrigin - performance.timeOrigin : 0;
      await settle(2000, 50, 20000);
      po.disconnect(); const gap = hbStop(fcp);   /* heartbeat gaps after the first paint only */
      const after = lt.filter(e => e.startTime >= fcp).map(e => e.duration);
      xs.push(Math.max(gap, ...after));   /* long tasks if this Chrome attributes the frame's to us, else the heartbeat */
    }
    return xs;
  };

  /* name, function, state, viewport, stress gate (ms, null = baseline guard only) */
  const CASES = [
    ['collect_render', 'seed', 393, null], ['collect_key', 'seed', 393, null], ['day_switch', 'seed', 1440, null], ['board_drag', 'seed', 1920, null], ['boot', 'seed', 393, null], ['boot_collect', 'seed', 393, null],
    ['collect_render', 'B', 393, 100], ['collect_render', 'A', 393, 150], ['collect_key', 'B', 393, 50],
    ['day_switch', 'A', 1440, 50], ['board_drag', 'A', 1920, 20], ['boot', 'A', 393, 50], ['boot_collect', 'A', 393, 50]
  ].filter(c => !ONLY || c[0].includes(ONLY) || c[1] === ONLY);

  let baseline = null;
  try { const r = await fetch('perf-baseline.json?' + Date.now()); if (r.ok) baseline = await r.json(); } catch (e) {}
  for (let i = 0; i < 10; i++) calibrate();   /* warm up the JIT, or the first cases get a slower yardstick */
  say(JSON.stringify({case: 'calibration', ms: r1(median(Array.from({length: 5}, calibrate)))}));

  let fails = 0, row0 = {}; const rec = {cases: {}};
  for (const [name, state, vp, gate] of CASES) {
    const key = name + '@' + vp; let xs = null, err = null;
    const cal = median(Array.from({length: 5}, calibrate));   /* again per case, so a busy machine moves the yardstick with the numbers */
    try { xs = await C[name](state, vp); } catch (e) { err = String(e && e.message || e); }
    if (xs && Array.isArray(xs[0])) { if (!xs[0].length) xs = null; else { row0 = {dirs: xs.map(a => r1(median(a)))}; xs = xs.flat(); } } else row0 = {};
    const row = Object.assign({case: name, state, vp}, row0);
    if (!xs || !xs.length) { Object.assign(row, {ms: null, gate, status: 'skip'}, err ? {err} : {}); say(JSON.stringify(row)); continue; }
    const ms = row.dirs ? Math.max(...row.dirs) : r1(median(xs)), ratio = Math.round(ms / cal * 1000) / 1000; row.ms = ms;
    if (state === 'seed') {
      const b = baseline && baseline.cases && baseline.cases[key];
      rec.cases[key] = {ms, cal: r1(cal), ratio};
      /* a drag's p95 is a frame interval, bound to vsync and not to CPU speed: guarded in plain ms */
      row.gate = !b ? null : name === 'board_drag' ? r1(b.ms * GUARD) : r1((b.ratio * GUARD) * cal + QUANTUM); row.base = b ? b.ratio : null; row.ratio = ratio;
      row.status = !b ? 'skip' : ms <= row.gate ? 'pass' : 'fail';
      if (row.status === 'fail') fails++;
    } else {
      row.gate = gate; row.ratio = ratio;
      row.status = ms < gate ? 'pass' : STRESS_FAILS ? 'fail' : 'warn';
      if (row.status === 'fail') fails++;
    }
    row.cal = r1(cal); row.runs = xs.map(r1); if (name === 'board_drag') row.max = r1(Math.max(...dragMax));
    say(JSON.stringify(row));
  }
  if (fr) fr.remove();
  if (RECORD || !baseline) say('BASELINE ' + JSON.stringify(Object.assign({note: 'tools/perf.html seed cases: ms and ms / calibration ms at 4x CPU; re-record with node tools/perf-run.js --record', at: new Date().toISOString().slice(0, 10)}, rec)));
  lines.push(fails ? 'PERF FAIL (' + fails + ')' : 'PERF PASS');
  out.textContent = lines.join('\n'); document.title = fails ? 'PERF FAIL' : 'PERF PASS';
})().catch(e => { document.getElementById('out').textContent += '\nthrew: ' + (e && e.stack || e) + '\nPERF FAIL'; });
</script>
