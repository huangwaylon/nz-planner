<!doctype html>
<meta charset="utf-8">
<title>planner e2e</title>
<!-- End-to-end regression checks that need the real page (a DOM, storage, a reload). Not shipped.
     Serve the repo root and open /tools/e2e.html, or headless in CI:
       python3 -m http.server 8790 &
       google-chrome --headless=new --no-sandbox --virtual-time-budget=60000 --dump-dom \
         http://localhost:8790/tools/e2e.html | grep -q 'E2E PASS'
     It overwrites plan:nz and plan-ui:nz for this origin, so use a throwaway profile. -->
<pre id="out">E2E RUNNING</pre>
<script>
(async () => {
  const lines = [], wait = ms => new Promise(r => setTimeout(r, ms));
  let fails = 0;
  const ok = (c, m) => { lines.push((c ? 'ok   ' : 'FAIL ') + m); if (!c) fails++; };
  const until = async (f, ms = 10000) => { const t = Date.now(); while (Date.now() - t < ms) { try { const v = f(); if (v) return v; } catch (e) {} await wait(50); } return null; };
  const done = () => { lines.push(fails ? 'E2E FAIL (' + fails + ')' : 'E2E PASS'); document.getElementById('out').textContent = lines.join('\n'); document.title = fails ? 'E2E FAIL' : 'E2E PASS'; };
  try {
    const plans = await (await fetch('../data/nz/plans.json')).json();
    const base = plans.plans[0], D12 = '2027-02-12';
    /* an imported place, placed on Day 12 of My plan: it must survive a reload (R3 QA P0-1) */
    const IMP = {id: 'gm-e2e-beach', name: 'E2E Test Beach', src: 'gmaps', lat: -36.95, lon: 174.47, note: ''};
    const days = JSON.parse(JSON.stringify(base.days)); days[D12] = (days[D12] || []).concat([IMP.id]);
    localStorage.setItem('plan:nz', JSON.stringify({v: 1, active: 'my', my: {id: 'my', from: base.id, days, stay: {}, start: {}, notes: {}}, versions: [], imports: [IMP], booked: {}}));
    localStorage.setItem('plan-ui:nz', JSON.stringify({v: 1, day: 1, map: 'peek', hideIntro: true, hideInstall: true}));
    const fr = document.createElement('iframe'); fr.style.cssText = 'width:393px;height:852px;border:0';
    document.body.appendChild(fr);
    const errs = [];
    const load = () => new Promise(res => { fr.onload = () => { const w = fr.contentWindow;
      w.addEventListener('error', e => errs.push(String(e.message)));
      w.addEventListener('unhandledrejection', e => errs.push('rejection: ' + String(e.reason && (e.reason.stack || e.reason)).slice(0, 400)));
      w.addEventListener('unhandledrejection', e => errs.push(String(e.reason)));
      const ce = w.console.error; w.console.error = (...a) => { errs.push(a.map(String).join(' ')); ce.apply(w.console, a); };
      res(); }; fr.src = '../index.html?nosw&e2e=' + Date.now(); });
    const doc = () => fr.contentDocument, q = s => doc().querySelector(s), qa = s => [...doc().querySelectorAll(s)];
    const view = () => q('.v-plan'), rows = () => qa('main .pl-row');

    await load();
    ok(await until(() => rows().length), 'boots and renders the day');
    ok(!!q('main .pl-row[data-id="' + IMP.id + '"]'), 'an imported place on the day renders after a reload');
    const n0 = rows().length;

    /* add a candidate to the same day through the picker: no throw, the day grows, the import stays */
    q('.pl-browsebtn').click();
    const add = await until(() => qa('.pl-clist .pl-addbtn')[0]);
    ok(!!add, 'the candidate list opens');
    if (!add) {   /* say why, so a CI-only failure can be read from the log */
      const w = fr.contentWindow, d = w.document;
      lines.push('  diag ' + JSON.stringify({errs, more: !!(w.planner && w.planner.more),
        moreScript: [...d.scripts].map(x => x.src).filter(x => /more/.test(x)),
        browse: !!d.querySelector('.pl-browse'), clist: !!d.querySelector('.pl-clist'),
        rows: d.querySelectorAll('.pl-clist > *').length, sheet: (d.querySelector('[role=dialog]') || {}).className || null, sheetText: ((d.querySelector('[role=dialog]') || {}).textContent || '').replace(/\s+/g, ' ').slice(0, 160), tz: Intl.DateTimeFormat().resolvedOptions().timeZone, now: new Date().toISOString(),
        online: w.navigator.onLine}));
      throw new Error('stop: no candidate list');
    }
    add.click();
    const pill = await until(() => q('.pl-dayq .pl-dq[data-day="1"]'));
    ok(!!pill && /\d/.test(pill.textContent), 'the day pill shows its simulated cost');
    pill.click(); if (pill.dataset.why && pill.isConnected) pill.click();
    ok(await until(() => rows().length === n0 + 1, 3000), 'adding to a day that holds an import works');
    ok(!!q('main .pl-row[data-id="' + IMP.id + '"]'), 'the import is still on the day after the add');

    /* a far add on the flight day warns first and needs a second tap (R3 P0-1) */
    const s = q('.pl-q'); s.value = 'パリトゥトゥ'; s.dispatchEvent(new Event('input', {bubbles: true}));
    const far = await until(() => q('.pl-cand[data-id="paritutu-rock"] .pl-addbtn'));
    if (far) {
      far.click();
      const p16 = await until(() => q('.pl-cand[data-id="paritutu-rock"] .pl-dq[data-day="5"]'));
      const before = view()._pl.sim('my')[5].rows.length;
      ok(!!p16 && /フライト|flight/i.test(p16.dataset.why || ''), 'Feb 16 pill names the flight before the tap');
      /* the list may have re-ranked since (keywords arriving): tap the pill as it is now */
      q('.pl-cand[data-id="paritutu-rock"] .pl-dq[data-day="5"]').click();
      ok(view()._pl.sim('my')[5].rows.length === before && /フライト|flight/i.test(q('.pl-cand[data-id="paritutu-rock"] .pl-dayqm').textContent), 'the first tap on a ⚠ day explains and does not add');
    } else ok(false, 'search finds Paritutu');
    q('.pl-sheet [data-act="close"], [data-act="close"]').click();

    /* reload: the add persisted with the import */
    const n1 = rows().length;
    await load();
    ok(await until(() => rows().length === n1), 'after a reload the day has the same stops');
    ok(!!q('main .pl-row[data-id="' + IMP.id + '"]'), 'the import survives a second reload');

    /* a day tap animates the map; afterwards nothing may think a gesture is still running, and the
       full coastline must still arrive (R3 QA P1-2: M.tw was never cleared) */
    q('.pl-daybtn[data-day="2"]').click();
    await wait(900);
    ok(view()._pl.busy() === false, 'no gesture or tween is left running after a day tap');
    ok(await until(() => view()._pl.land() > 20, 12000), 'the full coastline replaces the light one after the tap');
    q('.pl-daybtn[data-day="4"]').click(); await wait(900);
    ok(view()._pl.busy() === false, 'still idle after a second animated move');

    /* R4 P0: every committing action previews first. 日を移動 to the flight day says why on the day
       button and needs a second tap; the toast after it names what broke */
    const toastTxt = () => (q('.pl-toast span') || {}).textContent || '';
    q('.pl-daybtn[data-day="3"]').click(); await wait(700);
    const mv = await until(() => q('main .pl-row[data-id="three-sisters-elephant-rock"] [data-act="move"]'));
    if (mv) {
      const d16 = () => view()._pl.sim('my')[5].rows.map(r => r[2]).join();
      const before16 = d16();
      mv.click();
      const p16 = await until(() => q('.pl-sbody [data-act="domove"][data-day="5"]'));
      ok(!!p16 && /フライト/.test((p16.querySelector('.pl-dwhy') || {}).textContent || ''), '日を移動: the flight day shows ⚠ and why before the tap');
      p16.click(); await wait(300);
      ok(d16() === before16 && !!q('.pl-sbody [data-act="domove"]') && /⚠/.test(toastTxt()), '日を移動: the first tap explains and moves nothing');
      q('.pl-sbody [data-act="domove"][data-day="5"]').click(); await wait(500);
      ok(d16() !== before16 && /⚠/.test(toastTxt()), '日を移動: the second tap moves, and the toast names what broke');
      q('.pl-toast .pl-tu').click(); await wait(500);
      ok(d16() === before16, 'undo puts the stop back');
    } else ok(false, 'Three Sisters has a move button on Feb 14');

    /* a typed start time that breaks the day: the inline bar offers keep or undo */
    q('.pl-daybtn[data-day="5"]').click(); await wait(700);
    const tin = q('main .pl-timein');
    if (tin) { const was = view()._pl.sim('my')[5].rows[0][0];
      tin.value = '16:00'; tin.dispatchEvent(new Event('change', {bubbles: true}));
      const bar = await until(() => q('main .pl-confirm'), 3000);
      ok(!!bar && /この並びだと|With this order/.test(bar.textContent), 'a breaking start time shows the inline keep/undo bar');
      if (bar) { bar.querySelector('[data-act="undoit"]').click(); await wait(500); }
      ok(view()._pl.sim('my')[5].rows[0][0] === was, '元に戻す in the bar restores the start');
    } else ok(false, 'the start time field exists');

    /* stay ± on a place that is on two days changes that day only (stayDay) */
    q('.pl-planbtn').click(); const hut = await until(() => q('.pl-planopt[data-id="hut"]'));
    hut.click(); await wait(600); q('[data-act="close"]') && q('[data-act="close"]').click();
    q('.pl-daybtn[data-day="3"]').click(); await wait(700);
    const t13 = () => JSON.stringify(view()._pl.sim('hut')[2].rows.find(r => r[2] === 'pouakai-tarns'));
    const myT13 = () => JSON.stringify((view()._pl.sim('my')[2].rows.find(r => r[2] === 'pouakai-tarns')));
    const plus = q('main .pl-row[data-id="pouakai-tarns"] [data-act="stay"][data-d="15"]');
    if (plus) { const b13 = t13();
      plus.click(); await wait(400); if (/⚠/.test(toastTxt())) { q('main .pl-row[data-id="pouakai-tarns"] [data-act="stay"][data-d="15"]').click(); await wait(400); }
      const saved = JSON.parse(localStorage.getItem('plan:nz')).my;
      ok(saved && saved.stayDay && saved.stayDay['2027-02-14'] && saved.stayDay['2027-02-14']['pouakai-tarns'] > 0 && (saved.stay || {})['pouakai-tarns'] === ((plans.plans.find(x => x.id === 'hut').stay || {})['pouakai-tarns']), 'stay ± writes stayDay for a place on two days');
      ok(myT13() === b13, 'the Feb 13 visit is unchanged');
    } else ok(false, 'the tarns have a stay stepper on Feb 14');

    /* ---------- the workflow (docs/WORKFLOW.md): state v2, tiers, groups ---------- */
    const seedV1 = JSON.stringify({v: 1, active: 'my', my: {id: 'my', from: base.id, days, stay: {}, start: {}, notes: {piha: 'タオル'}}, versions: [], imports: [IMP], booked: {}});
    localStorage.removeItem('plan:nz:v1'); localStorage.removeItem('plan:nz:broken');
    localStorage.setItem('plan:nz', seedV1);
    localStorage.setItem('plan-ui:nz', JSON.stringify({v: 1, day: 1, stage: 'collect', hideIntro: true, hideInstall: true}));
    await load();
    ok(await until(() => q('.pl-collect .pl-cc')), '① opens from plan-ui and shows cards');
    ok(localStorage.getItem('plan:nz:v1') === seedV1, 'v1 -> v2: the v1 string is copied to plan:nz:v1 first');
    ok(view()._pl.trip().notes.piha === 'タオル', 'v1 -> v2: notes move up to the trip');
    /* a tap on 行きたい tiers the card (keys are the desktop's, tested at 1440); it survives a reload and an undo */
    const tc = q('.pl-cs[data-k=""] .pl-cc'), tid = tc.dataset.id; tc.querySelector('[data-t="want"]').click();
    ok(view()._pl.tier(tid) === 'want' && JSON.parse(localStorage.getItem('plan:nz')).v === 2, 'the 行きたい button sets the tier and saves v2');
    await load(); await until(() => q('.pl-collect .pl-cc'));
    ok(view()._pl.tier(tid) === 'want', 'the tier survives a reload');
    q('.pl-cs[data-k="want"] .pl-cc[data-id="'+tid+'"] [data-t="want"]').click();
    ok(view()._pl.tier(tid) === '', 'tapping the lit tier again puts it back in the inbox');
    doc().dispatchEvent(new KeyboardEvent('keydown', {code: 'KeyZ', key: 'z', metaKey: true, bubbles: true})); await wait(200);
    ok(view()._pl.tier(tid) === 'want', '⌘Z undoes a tier change');
    /* group by the sheet, then carry tiers and the group's ids through a v3 link */
    const gc = q('.pl-cs[data-k=""] .pl-cc'), gid0 = gc.dataset.id; gc.querySelector('[data-t="must"]').click();
    q('[data-ca="selmode"]').click(); await wait(100); q('.pl-cc[data-id="' + gid0 + '"] .pl-ccb small').click(); await wait(100); q('[data-ca="group"]').click();
    const gname = await until(() => q('.pl-cgname'));
    if (gname) { gname.value = 'テスト外出'; q('[data-act="cgnew"]').click(); }
    ok(view()._pl.trip().groups.some(g => g.name === 'テスト外出' && g.ids.indexOf(gid0) >= 0), '選択 then グループへ makes a group');
    const code = await view()._pl.code();
    localStorage.setItem('plan:nz', JSON.stringify({v: 2, active: 'classic', trip: {tier: {}, groups: [], notes: {}}, my: null, versions: [], imports: [], booked: {}}));
    await load(); await until(() => q('.pl-collect .pl-cc'));
    fr.contentWindow.location.hash = '#plan-nz=' + code;
    ok(await until(() => view()._pl.tier(gid0) === 'must', 5000), 'a v3 link fills her unset tiers');
    ok(view()._pl.trip().groups.some(g => g.ids.indexOf(gid0) >= 0 && g.name !== 'テスト外出'), 'its group arrives with the ids, never the name');
    /* the old-app guard: a stale v1 app moved our v2 to :broken and wrote v1 over it */
    const v2now = localStorage.getItem('plan:nz');
    localStorage.setItem('plan:nz:broken', v2now);
    localStorage.setItem('plan:nz', JSON.stringify({v: 1, active: 'classic', my: null, versions: [], imports: [], booked: {}}));
    await load(); await until(() => q('.pl-collect .pl-cc'));
    ok(view()._pl.tier(gid0) === 'must' && JSON.parse(localStorage.getItem('plan:nz')).v === 2, 'the trip comes back from :broken, saved as v2 again');

    /* ③: the calendar loads with ③; its Feb 14 opens ② on day 4 (index 3) */
    q('.pl-stage[data-stage="review"]').click();
    const c14 = await until(() => q('.pl-cal-d[data-date="2027-02-14"]'), 8000);
    ok(!!c14 && qa('.pl-cal-vt thead th').length >= 2, '③ shows the month and at least two versions');
    if (c14) { c14.click(); await wait(400); }
    ok(view().dataset.stage === 'plan' && q('.pl-daybtn[data-day="3"]').getAttribute('aria-pressed') === 'true', 'a calendar day opens ② on that day');
    /* the phone never asked for the desktop chunk */
    ok(!fr.contentWindow.performance.getEntriesByType('resource').some(e => /planner-desk/.test(e.name)), 'a 393-wide planner never loads planner-desk');
    /* ---------- wide: 1440 then 1920, in a second frame ---------- */
    const wf = document.createElement('iframe'); wf.style.cssText = 'width:1440px;height:900px;border:0'; document.body.appendChild(wf);
    localStorage.setItem('plan-ui:nz', JSON.stringify({v: 1, day: 0, stage: 'plan', hideIntro: true, hideInstall: true}));
    await new Promise(r => { wf.onload = r; wf.src = '../index.html?nosw&w=' + Date.now(); });
    const wd = () => wf.contentDocument, wq = s => wd().querySelector(s), wv = () => wq('.v-plan');
    wf.contentWindow.addEventListener('error', e => errs.push('wide: ' + e.message));
    ok(await until(() => wq('.pl-palette .pl-pi'), 12000), 'at 1440 the desk chunk loads and the palette fills');
    const R = s => wq(s).getBoundingClientRect(), pal = R('.pl-palette'), mn = R('.pl-main'), mp = R('.pl-mapcard');
    ok(pal.right <= mn.left + 1 && mn.right <= mp.left + 1 && wd().documentElement.scrollWidth <= wf.contentWindow.innerWidth, 'palette | day | map side by side, no sideways scroll');
    const mapNode = wq('svg.pl-map');
    /* ① at 1440: the keys (J then 3) tier the focused card, and the rail sits beside the cards */
    wq('.pl-stage[data-stage="collect"]').click();
    const k1 = await until(() => wq('.pl-collect .pl-cs[data-k=""] .pl-cc'), 6000);
    if (k1) { const kid = k1.dataset.id; k1.click(); k1.focus();
      wd().dispatchEvent(new KeyboardEvent('keydown', {code: 'Digit3', key: '3', bubbles: true}));
      ok(wv()._pl.tier(kid) === 'maybe', 'at 1440 key 3 sets 時間があれば on the focused card');
      ok(R('.pl-crail').right <= R('.pl-clist').left + 1, 'the filter rail sits left of the cards'); }
    else ok(false, '① cards at 1440');
    wq('.pl-stage[data-stage="plan"]').click(); await wait(500);
    /* drag a palette place onto the day; the ghost's arrival is the applied time */
    const src = wq('.pl-palette .pl-pi'), sid = src.dataset.id, sr = src.getBoundingClientRect(), tl = wq('.pl-main .pl-tl').getBoundingClientRect();
    const pe = (el, type, x, y) => el.dispatchEvent(new (wf.contentWindow.PointerEvent)(type, {bubbles: true, cancelable: true, pointerType: 'mouse', clientX: x, clientY: y, button: 0, pointerId: 1, isPrimary: true}));
    pe(src, 'pointerdown', sr.x + 8, sr.y + 8);
    for (let i = 1; i <= 8; i++) { pe(wf.contentWindow, 'pointermove', sr.x + 8 + (tl.x + 80 - sr.x) * i / 8, sr.y + 8 + (tl.bottom - 30 - sr.y) * i / 8); await wait(40); }
    await wait(120);
    const gtxt = (wq('.pl-dgh') || {}).textContent || '', at = (/着 (\d\d:\d\d)/.exec(gtxt) || [])[1];
    ok(!!at, 'the ghost shows the arrival before the drop: ' + gtxt.slice(0, 60));
    pe(wf.contentWindow, 'pointerup', tl.x + 80, tl.bottom - 30); await wait(400);
    const armed = !wq('.pl-armbar').hidden;
    if (armed) { ok(/⚠/.test(wq('.pl-armbar').textContent), 'a breaking drop lands armed with its reason'); wd().dispatchEvent(new KeyboardEvent('keydown', {key: 'Enter', bubbles: true})); await wait(400); }
    const row = wv()._pl.sim('my').flatMap(d => d.rows).find(r => r[2] === sid);   /* whichever day the frame opened on */
    ok(row && row[0] === at, 'the dropped place starts at the ghost\'s time: ' + (row && row[0]) + ' vs ' + at);
    /* 1920: the 6-day board by default, every day on the map, the same map node */
    wf.style.width = '1920px'; wf.style.height = '1080px';
    ok(await until(() => wv().classList.contains('pl-6') && wd().querySelectorAll('.pl-bc').length === 6, 4000), 'at 1920 the 6-day board shows six columns');
    ok(wq('svg.pl-map') === mapNode && wd().querySelectorAll('.pl-alld path').length > 0, 'the one map node draws every day');
    ok(wd().documentElement.scrollWidth <= wf.contentWindow.innerWidth, 'no sideways scroll at 1920');
    wf.remove();

    ok(!errs.length, 'no errors' + (errs.length ? ': ' + errs.slice(0, 3).join(' | ') : ''));
  } catch (e) { ok(false, 'threw: ' + (e && e.stack || e)); }
  done();
})();
</script>
